# Tells Bing, Yandex and the other IndexNow engines which pages a push changed, so they
# re-crawl in minutes. The pages are canonical on mohamedgado.com (it proxies this site),
# whose own deploy hook only sees pages it builds itself, never these.
#
# A changed file is sent only when its mohamedgado.com URL answers 200, so a page the proxy
# does not map is skipped rather than reported as a 404. The key is public by design: it is
# served at https://www.mohamedgado.com/<key>.txt, which is how IndexNow checks the host.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html']
  workflow_dispatch: # by hand: every page
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ping IndexNow with the changed pages
        env:
          BEFORE: ${{ github.event.before }}
          KEY: 9ed35449b65e4a60b36e5fda9825e7bc
          BASE: https://www.mohamedgado.com/projects/nafis
        run: |
          set -eu
          sleep 90 # let GitHub Pages publish first
          urls=""
          for f in $(git diff --name-only "$BEFORE" HEAD -- '*.html' 2>/dev/null || git ls-files '*.html'); do
            case "$f" in
              index.html) u="$BASE/privacy" ;;
              go.html) u="$BASE/go" ;;
              go-ar.html) u="$BASE/go-ar" ;;
              banks/index.html) u="$BASE/banks" ;;
              banks/*.html) b="${f#banks/}"; u="$BASE/banks/${b%.html}" ;;
              *.html) u="$BASE/${f%.html}" ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
            # The proxy serves some pages under their file name (delete-account.html).
            if [ "$code" != 200 ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$f")" = 200 ]; then u="$BASE/$f"; code=200; fi
            if [ "$code" = 200 ]; then urls="$urls\"$u\","; else echo "skip $u ($code)"; fi
          done
          [ -n "$urls" ] || { echo "nothing proxied changed"; exit 0; }
          body="{\"host\":\"www.mohamedgado.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://www.mohamedgado.com/$KEY.txt\",\"urlList\":[${urls%,}]}"
          echo "$body"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow answered $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
