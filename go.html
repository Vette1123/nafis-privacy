<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>نفيس · Nafis</title>
    <meta
      name="description"
      content="حمّل نفيس: أسعار الذهب والفضة والدولار في بلدك، مع محفظة وزكاة وتنبيهات. Get Nafis: local gold, silver and dollar prices, with a portfolio, zakat and alerts."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0E0B07" />
    <meta property="og:title" content="نفيس · Nafis" />
    <meta
      property="og:description"
      content="أسعار الذهب والدولار في بلدك. Gold, silver and the dollar at your local price."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vette1123.github.io/nafis-privacy/go" />
    <link rel="icon" href="icon.png" />
    <!--
      The one link printed inside every share card's QR code. The card travels to
      someone whose phone we cannot know, so the choice of store is made HERE, on the
      reader's own device: their store is the gold button, the other stays one tap
      away, and both work with JavaScript off. Served at /nafis-privacy/go (GitHub
      Pages drops the .html), which keeps the encoded URL short enough for a 33-module
      code. The path must never change: cards already sent cannot be updated.

      Self-contained like the policy: no web fonts, no scripts from anyone else.
    -->
    <style>
      :root {
        --ink: #f5eedd;
        --soft: #cbbe9f;
        --faint: #a99b7c;
        --gold: #e0b044;
        --gold-bright: #f0cb6e;
        --plate: #15110a;
        --line: rgba(224, 176, 68, 0.3);
        --arabic: "SF Arabic", "Geeza Pro", "Noto Naskh Arabic", "Noto Sans Arabic", sans-serif;
        --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--ui);
        /* The app's own molten sweep: obsidian floor, warm gold rising off one
           corner, so the page reads as the card the reader just scanned. The floor
           is lifted off pure black for the same reason the composed images lift it. */
        background:
          radial-gradient(65% 42% at 100% 0%, rgba(224, 176, 68, 0.16), transparent 72%),
          linear-gradient(168deg, #2a1f0e 0%, #1c160d 34%, #14100a 70%, #0e0b07 100%);
        background-attachment: fixed;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0;
      }
      .mark {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        display: block;
        box-shadow:
          0 24px 48px -20px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(224, 176, 68, 0.22);
      }
      h1 {
        font-family: var(--arabic);
        font-weight: 700;
        font-size: 60px;
        line-height: 1.4;
        margin: 20px 0 0;
        color: var(--gold);
      }
      .latin {
        font-size: 13px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--faint);
        margin: -2px 0 0;
        direction: ltr;
      }
      .tagline {
        margin: 22px 0 0;
        font-size: 19px;
        line-height: 1.6;
        color: var(--ink);
        font-family: var(--arabic);
      }
      .tagline small {
        display: block;
        font-family: var(--ui);
        font-size: 14px;
        color: var(--soft);
        direction: ltr;
        margin-top: 4px;
      }
      .stores {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 34px;
      }
      /* One shape for both buttons, content centred as a group so the button reads
         balanced whichever side the icon lands on (the page direction follows the
         reader's language). Two lines, both languages, on every button. */
      .store {
        display: grid;
        grid-template-columns: 34px auto;
        align-items: center;
        justify-content: center;
        column-gap: 16px;
        width: 100%;
        min-height: 72px;
        padding: 12px 20px;
        border-radius: 18px;
        text-decoration: none;
        color: var(--ink);
        /* A solid ground, not a translucent one: over the sweep a translucent button
           showed the gradient through its own edge and the border read as uneven.
           Painted under the border too, so the 1px edge never shows a seam. */
        background: #1d170e;
        background-clip: padding-box;
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(245, 238, 221, 0.05);
        transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
      .store:hover {
        border-color: rgba(224, 176, 68, 0.85);
        background-color: #241c11;
        transform: translateY(-1px);
      }
      .store:active { transform: translateY(0) scale(0.985); }
      .store:focus-visible { box-shadow: 0 0 0 2px var(--plate), 0 0 0 4px var(--gold); }
      .store svg { width: 34px; height: 34px; display: block; }
      .store .t { display: flex; flex-direction: column; line-height: 1.3; text-align: center; }
      .store .t b { font-size: 18px; font-weight: 700; }
      .store .t span { font-size: 13px; color: var(--soft); }
      .store .t [lang="en"] { direction: ltr; }
      .store .t [lang="ar"] { direction: rtl; }
      .store.primary {
        background: linear-gradient(135deg, #f6dc95, #e0b044 55%, #b98a2c);
        border-color: rgba(255, 244, 214, 0.55);
        color: #1a1408;
        box-shadow: inset 0 1px 0 rgba(255, 250, 235, 0.45), 0 18px 40px -18px rgba(224, 176, 68, 0.7);
      }
      .store.primary:hover {
        border-color: rgba(255, 250, 235, 0.9);
        filter: brightness(1.04);
      }
      .store.primary:focus-visible { box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px var(--plate); }
      .store.primary .t span { color: rgba(26, 20, 8, 0.72); }
      /* Apple's mark is monochrome, so it takes the button's ink. Play's mark is its
         four colours or it is not Play's mark; on the gold button alone it sits on a
         small ink coin so the colours keep their contrast (on the dark button the
         coin read as a box with an edge, not as a coin). */
      .store.apple svg path { fill: currentColor; }
      .store.primary.play svg { padding: 6px; border-radius: 10px; background: var(--plate); box-sizing: border-box; }
      .foot {
        margin-top: 34px;
        font-size: 13px;
        color: var(--faint);
        line-height: 1.7;
      }
      .foot a { color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }
      .foot a:hover { color: var(--gold); }

      @media (prefers-reduced-motion: reduce) {
        .store, .store:hover, .store:active { transition: none; transform: none; }
      }
      @media (prefers-reduced-motion: no-preference) {
        main > * { animation: rise 640ms cubic-bezier(0.16, 1, 0.3, 1) both; }
        main > :nth-child(2) { animation-delay: 60ms; }
        main > :nth-child(3) { animation-delay: 100ms; }
        main > :nth-child(4) { animation-delay: 140ms; }
        main > :nth-child(5) { animation-delay: 200ms; }
        main > :nth-child(6) { animation-delay: 260ms; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The launcher icon itself (assets/images/icon.png in the app repo), because
           every brand moment in the app draws the same bitmap. -->
      <img class="mark" src="icon.png" width="104" height="104" alt="" />
      <h1>نفيس</h1>
      <p class="latin">Nafis</p>
      <p class="tagline">
        سعر الذهب والفضة والدولار في بلدك
        <small>Gold, silver and the dollar at your local price</small>
      </p>

      <nav class="stores" aria-label="التحميل">
        <a class="store apple" id="apple" href="https://apps.apple.com/app/id6807595780">
          <svg viewBox="-93 0 1000 1000" aria-hidden="true"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
          <span class="t"><b lang="ar">حمّل لأجهزة iPhone</b><span lang="en">Download on the App Store</span></span>
        </a>
        <a class="store play" id="play" href="https://play.google.com/store/apps/details?id=com.mohamedgado.nafis&amp;referrer=utm_source%3Dcard%26utm_medium%3Dqr">
          <svg viewBox="20.1 332.75 137 137" aria-hidden="true"><path fill="#FFD400" d="M119.2,421.2c15.3-8.4,27-14.8,28-15.3c3.2-1.7,6.5-6.2,0-9.7c-2.1-1.1-13.4-7.3-28-15.3l-20.1,20.2L119.2,421.2z"/><path fill="#FF3333" d="M99.1,401.1l-64.2,64.7c1.5,0.2,3.2-0.2,5.2-1.3c4.2-2.3,48.8-26.7,79.1-43.3L99.1,401.1L99.1,401.1z"/><path fill="#48FF48" d="M99.1,401.1l20.1-20.2c0,0-74.6-40.7-79.1-43.1c-1.7-1-3.6-1.3-5.3-1L99.1,401.1z"/><path fill="#3BCCFF" d="M99.1,401.1l-64.3-64.3c-2.6,0.6-4.8,2.9-4.8,7.6c0,7.5,0,107.5,0,113.8c0,4.3,1.7,7.4,4.9,7.7L99.1,401.1z"/></svg>
          <span class="t"><b lang="ar">حمّل لأجهزة Android</b><span lang="en">Get it on Google Play</span></span>
        </a>
      </nav>

      <p class="foot">
        مجاني · بدون إعلانات · يشتغل بدون إنترنت<br />
        <a href="/nafis-privacy/">سياسة الخصوصية · Privacy</a>
      </p>
    </main>

    <script>
      // The reader's own store becomes the gold button and moves to the top. iPadOS
      // reports itself as a Mac, so Macintosh counts as Apple. Nothing redirects: a
      // landing the reader can see beats a blank flash into a store page they did
      // not choose, and an in-app browser that blocks the bounce would have shown
      // them nothing at all.
      (function () {
        // Direction follows the reader's language: Arabic readers get the icon on
        // the right, everyone else on the left. Both languages stay on every button.
        var lang = (navigator.language || '').toLowerCase();
        if (lang.indexOf('ar') !== 0) {
          document.documentElement.setAttribute('dir', 'ltr');
          document.documentElement.setAttribute('lang', 'en');
        }
        var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent || '');
        var first = document.getElementById(apple ? 'apple' : 'play');
        first.classList.add('primary');
        first.parentNode.prepend(first);

        // Attribution survives the hop. A text share or a cross-promo row arrives as
        // `?s=<anchor>` (settings, rafiq, masareef…); Play reads it back out of its
        // `referrer` parameter as utm_source=<anchor>, utm_medium=share. Without the
        // parameter — a scanned card — the default in the href stands: card/qr.
        var m = /[?&]s=([a-z0-9_-]{1,40})/i.exec(location.search);
        if (m) {
          var play = document.getElementById('play');
          var referrer = 'utm_source=' + m[1].toLowerCase() + '&utm_medium=share';
          play.href = play.href.replace(/&referrer=[^&]*/, '&referrer=' + encodeURIComponent(referrer));
        }
      })();
    </script>
  </body>
</html>
