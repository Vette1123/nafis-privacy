<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nafis Privacy Policy</title>
    <meta name="robots" content="noindex" />
    <!-- Old links (the app-repo Pages path, a mistyped anchor) must never dead-end on a
         privacy policy: Play requires the URL to resolve. Send everything to the policy. -->
    <meta http-equiv="refresh" content="0; url=/nafis-privacy/" />
    <link rel="canonical" href="https://vette1123.github.io/nafis-privacy/" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 15vh auto;
        max-width: 34rem;
        padding: 0 20px;
        line-height: 1.7;
        color: #1c1a17;
        background: #fbfaf8;
      }
      a {
        color: #9a6b16;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #efeae1;
          background: #100e0b;
        }
        a {
          color: #e0b044;
        }
      }
    </style>
  </head>
  <body>
    <p>Redirecting to the Nafis privacy policy.</p>
    <p>
      If nothing happens, open
      <a href="https://vette1123.github.io/nafis-privacy/">vette1123.github.io/nafis-privacy</a>.
    </p>
    <p lang="ar" dir="rtl">
      جارٍ التحويل إلى سياسة خصوصية نفيس. إن لم يحدث شيء، افتح الرابط أعلاه.
    </p>
  </body>
</html>
